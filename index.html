<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои привычки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Мои привычки</h1>
      <p>Маленькие шаги каждый день приводят к большим результатам.</p>
    </header>

    <form id="habit-form">
      <label for="habit-input">Новая привычка</label>
      <input
        id="habit-input"
        name="habit"
        type="text"
        placeholder="Например, выпить стакан воды"
      >
      <button type="submit">Добавить</button>
    </form>
    <p class="help-text">
  Отмечайте выполненные привычки и удаляйте те, которые больше не нужны.
</p>

    <section class="progress" aria-label="Прогресс привычек">
      <p id="progress-summary">Выполнено: 0 из 0</p>
      <div
        class="progress-bar"
        role="progressbar"
        aria-label="Доля выполненных привычек"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-valuetext="Выполнено: 0 из 0"
      >
        <div id="progress-fill"></div>
      </div>
    </section>

    <ul id="habit-list" aria-label="Список привычек"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
